<header class="topbar">

  <!-- ── Left: Mobile toggle + Search ── -->
  <div class="topbar-left">
    <button class="topbar-menu-btn" (click)="onMenuToggle()" id="topbar-menu-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div class="search-box" id="topbar-search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        class="search-input"
        placeholder="Rechercher..."
        [(ngModel)]="searchQuery"
      />
    </div>
  </div>

  <!-- ── Right: Actions ── -->
  <div class="topbar-right">

    <!-- Messages -->
    <button class="topbar-action" id="topbar-messages-btn" title="Messages" (click)="navigateToMessages()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
      @if (unreadMessages > 0) {
        <span class="action-badge">{{ unreadMessages }}</span>
      }
    </button>

    <!-- Notifications -->
    <button class="topbar-action" id="topbar-notifications-btn" title="Mes notifications"
      aria-label="Ouvrir mes notifications" (click)="navigateToNotifications()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      @if (unreadNotifications > 0) {
        <span class="action-badge">{{ unreadNotifications > 99 ? '99+' : unreadNotifications }}</span>
      }
    </button>

    <!-- Divider -->
    <div class="topbar-divider"></div>

    <!-- Profile -->
    <div class="profile-wrapper">
      <button class="profile-btn" (click)="toggleProfileMenu()" id="topbar-profile-btn">
        <div class="profile-avatar">
          <img *ngIf="userPhoto" [src]="userPhoto" alt="Profile" class="topbar-avatar-img" />
          <svg *ngIf="!userPhoto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <svg class="profile-chevron" [class.rotated]="showProfileMenu" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <!-- Dropdown -->
      @if (showProfileMenu) {
        <div class="profile-dropdown" id="profile-dropdown">
          <div class="dropdown-header">
            <span class="dropdown-name">{{ userName }}</span>
            <span class="dropdown-email">{{ userEmail }}</span>
          </div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" (click)="navigateToProfile()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Mon profil
          </button>
          <button class="dropdown-item dropdown-item--danger" (click)="logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Déconnexion
          </button>
        </div>
      }
    </div>
  </div>
</header>
